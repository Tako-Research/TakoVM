name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Build and push Docker images to GHCR
  docker:
    name: Push Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: executor
            dockerfile: docker/Dockerfile.executor
          - image: server
            dockerfile: docker/Dockerfile.server
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version and repo
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MAJOR="${VERSION%%.*}"
          REPO="${GITHUB_REPOSITORY,,}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo }}/${{ matrix.image }}:latest
            ghcr.io/${{ steps.meta.outputs.repo }}/${{ matrix.image }}:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.repo }}/${{ matrix.image }}:${{ steps.meta.outputs.major }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Publish Python package to PyPI
  pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # trusted publishing (OIDC)
    environment:
      name: pypi
      url: https://pypi.org/p/tako-vm
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build package
        run: uv build --sdist --wheel

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always

  # Create the GitHub Release so the Releases page stays in sync with PyPI/GHCR
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [docker, pypi]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Pull the section between "## [VERSION]" and the next "## [" heading.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { flag=1; next }
            flag && /^## \[/ { exit }
            flag { print }
          ' CHANGELOG.md > release_notes.md
          # Trim leading/trailing blank lines.
          sed -i -e '/./,$!d' release_notes.md
          if [ -s release_notes.md ]; then
            echo "found=1" >> "$GITHUB_OUTPUT"
          else
            echo "found=0" >> "$GITHUB_OUTPUT"
            echo "No CHANGELOG section for $VERSION; will auto-generate notes."
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; skipping."
            exit 0
          fi
          if [ "${{ steps.notes.outputs.found }}" = "1" ]; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Tako VM $GITHUB_REF_NAME" \
              --notes-file release_notes.md \
              --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Tako VM $GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
