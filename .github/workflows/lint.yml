name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install ruff
        # Pinned so CI formatting matches local/pre-commit; bump deliberately.
        # Must stay in sync with .pre-commit-config.yaml and pyproject [dev].
        run: pip install ruff==0.16.1

      - name: Run ruff check
        run: ruff check tako_vm/ tests/

      - name: Run ruff format check
        run: ruff format --check tako_vm/ tests/
