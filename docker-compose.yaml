# Tako VM Docker Compose
#
# Start everything (server + PostgreSQL + executor image + hardened socket proxy):
#   docker compose up -d --build
#
# This builds the executor image, brings up PostgreSQL and the docker-socket-proxy,
# then starts the API server once all three are ready. The server is live at
# http://localhost:8000.
#
# View logs:
#   docker compose logs -f tako-vm
#
# The `executor-build` service builds the `code-executor:latest` image the server
# spawns per job, then exits — seeing it as "Exited (0)" in `docker compose ps` is
# expected, not an error.

services:
  docker-socket-proxy:
    # Digest-pinned so a repointed upstream tag can't change the proxy that
    # gates the server's Docker access (dependabot keeps the digest current).
    image: tecnativa/docker-socket-proxy:latest@sha256:1f3a6f303320723d199d2316a3e82b2e2685d86c275d5e3deeaf182573b47476
    container_name: tako-vm-docker-socket-proxy
    environment:
      # Docker CLI health/startup checks
      - INFO=1
      # Required for docker run lifecycle: create/start/wait/logs/remove.
      - CONTAINERS=1
      # Required for image inspection during container creation.
      - IMAGES=1
      # Required because executor containers use a named uv cache volume.
      - VOLUMES=1
      # Required for container create/start/stop API calls.
      - POST=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - docker-internal
    security_opt:
      - no-new-privileges:true

  tako-vm:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    image: tako-vm-server:latest
    container_name: tako-vm
    ports:
      - "8000:8000"
    volumes:
      # Shared workspace for job files (must match host path for Docker mounts)
      - /tmp/tako-vm-jobs:/tmp/tako-vm-jobs
      # No config file is needed for a fresh `docker compose up`: the image bakes
      # in tako_vm.yaml.example as /app/tako_vm.yaml, and the env vars below
      # override the settings that matter here. To customize, copy the example
      # and uncomment the mount below:
      #   cp tako_vm.yaml.example tako_vm.yaml
      # Do NOT mount ./tako_vm.yaml without creating it first — Docker would
      # create the missing path as an empty directory and the server would crash
      # trying to read it as a file.
      # - ./tako_vm.yaml:/app/tako_vm.yaml:ro
      # Optional: persist data
      # - tako-vm-data:/root/.tako_vm
    environment:
      - PYTHONUNBUFFERED=1
      # Use shared workspace path for job files
      - TAKO_VM_WORKSPACE=/tmp/tako-vm-jobs
      - TAKO_VM_DATABASE_URL=postgresql://postgres:postgres@postgres:5432/tako_vm
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
    depends_on:
      docker-socket-proxy:
        condition: service_started
      postgres:
        condition: service_healthy
      # Gate startup on the executor image existing — otherwise the server comes
      # up but every job fails with "image not found" until it's built by hand.
      executor-build:
        condition: service_completed_successfully
    networks:
      - default
      - docker-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    # Digest-pinned (dependabot keeps the digest current).
    image: postgres:16-alpine@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
    container_name: tako-vm-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=tako_vm
    ports:
      - "5432:5432"
    volumes:
      - tako-vm-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tako_vm"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Builds the per-job executor image, then exits. The server depends on this
  # completing successfully (see tako-vm.depends_on) so a fresh `up` always has
  # the image the sandbox needs. Compose rebuilds only when the Dockerfile or
  # build context changes, so re-running `up` is cheap.
  executor-build:
    build:
      context: .
      dockerfile: docker/Dockerfile.executor
    image: code-executor:latest
    entrypoint: []  # Override entrypoint so we can just echo
    command: ["echo", "Executor image built"]

# Optional: persist data
volumes:
  tako-vm-postgres-data:

networks:
  docker-internal:
    internal: true
