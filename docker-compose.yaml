# Tako VM Docker Compose
#
# Start everything:
#   docker-compose up -d
#
# Build and start:
#   docker-compose up -d --build
#
# View logs:
#   docker-compose logs -f tako-vm

services:
  docker-socket-proxy:
    # Digest-pinned so a repointed upstream tag can't change the proxy that
    # gates the server's Docker access (dependabot keeps the digest current).
    image: tecnativa/docker-socket-proxy:latest@sha256:1f3a6f303320723d199d2316a3e82b2e2685d86c275d5e3deeaf182573b47476
    container_name: tako-vm-docker-socket-proxy
    environment:
      # Docker CLI health/startup checks
      - INFO=1
      # Required for docker run lifecycle: create/start/wait/logs/remove.
      - CONTAINERS=1
      # Required for image inspection during container creation.
      - IMAGES=1
      # Required because executor containers use a named uv cache volume.
      - VOLUMES=1
      # Required for container create/start/stop API calls.
      - POST=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - docker-internal
    security_opt:
      - no-new-privileges:true

  tako-vm:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    image: tako-vm-server:latest
    container_name: tako-vm
    ports:
      # Published on the host loopback ONLY, deliberately. This stack runs the
      # API with authentication disabled (see
      # TAKO_VM_ALLOW_UNAUTHENTICATED_NETWORK_ACCESS below); "8000:8000" would
      # bind every host interface and hand an unauthenticated /execute
      # code-execution endpoint to the whole network. To serve real traffic,
      # turn on TAKO_VM_API_AUTH_ENABLED + TAKO_VM_API_KEYS first, then widen
      # this mapping.
      - "127.0.0.1:8000:8000"
    volumes:
      # Shared workspace for job files (must match host path for Docker mounts)
      - /tmp/tako-vm-jobs:/tmp/tako-vm-jobs
      # Config with scaled worker settings (16 workers, 500 queue)
      - ./tako_vm.yaml:/app/tako_vm.yaml:ro
      # Optional: persist data
      # - tako-vm-data:/root/.tako_vm
    environment:
      - PYTHONUNBUFFERED=1
      # Use shared workspace path for job files
      - TAKO_VM_WORKSPACE=/tmp/tako-vm-jobs
      - TAKO_VM_DATABASE_URL=postgresql://${TAKO_VM_POSTGRES_USER:-tako}:${TAKO_VM_POSTGRES_PASSWORD:-change-me-local-dev-only}@postgres:5432/${TAKO_VM_POSTGRES_DB:-tako_vm}
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      # The container must bind 0.0.0.0 for the published port above to reach
      # it, which Tako VM refuses while api_auth_enabled=false. The refusal is
      # waived here only because the mapping above is loopback-scoped. Delete
      # this line the moment you widen it, and set TAKO_VM_API_AUTH_ENABLED=true
      # plus TAKO_VM_API_KEYS instead.
      - TAKO_VM_ALLOW_UNAUTHENTICATED_NETWORK_ACCESS=true
    depends_on:
      docker-socket-proxy:
        condition: service_started
      postgres:
        condition: service_healthy
    networks:
      - default
      - docker-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    # Digest-pinned (dependabot keeps the digest current).
    image: postgres:16-alpine@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
    container_name: tako-vm-postgres
    environment:
      # Placeholder credentials for local development. Override them in a .env
      # file (or the shell) before this stack goes anywhere real; the default
      # password is deliberately not a valid secret. Keep the password free of
      # characters that need percent-encoding in a URL - it is interpolated
      # into TAKO_VM_DATABASE_URL above verbatim.
      - POSTGRES_USER=${TAKO_VM_POSTGRES_USER:-tako}
      - POSTGRES_PASSWORD=${TAKO_VM_POSTGRES_PASSWORD:-change-me-local-dev-only}
      - POSTGRES_DB=${TAKO_VM_POSTGRES_DB:-tako_vm}
    # No `ports:` mapping, deliberately. The API reaches Postgres by service
    # name over the compose network; publishing 5432 on the host only exposed
    # the database to anything that can route to this machine. Use
    # `docker compose exec postgres psql` for a shell.
    volumes:
      - tako-vm-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TAKO_VM_POSTGRES_USER:-tako} -d ${TAKO_VM_POSTGRES_DB:-tako_vm}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Build executor image (run once, then remove)
  executor-build:
    build:
      context: .
      dockerfile: docker/Dockerfile.executor
    image: code-executor:latest
    entrypoint: []  # Override entrypoint so we can just echo
    command: ["echo", "Executor image built"]
    profiles:
      - build

# Optional: persist data
volumes:
  tako-vm-postgres-data:

networks:
  docker-internal:
    internal: true
