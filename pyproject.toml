[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tako-vm"
version = "0.3.1"
description = "A secure file system and Python execution layer for AI agents: isolated Docker/gVisor containers with job queues, retries, and history"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Tako VM Team" }
]
keywords = [
    "code-execution",
    "filesystem",
    "agent-infrastructure",
    "docker",
    "sandbox",
    "sandboxing",
    "security",
    "ai",
    "ai-agents",
    "llm",
    "gvisor",
    "code-interpreter",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Core dependencies
dependencies = [
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "pyyaml>=6.0",
    # Security floors for packages pulled in by requests. Listed here so an
    # upgrade of tako-vm also moves an existing install off the affected versions.
    "urllib3>=2.8.0",  # GHSA-8988-9cw3-xx77, GHSA-vxq7-64xx-v4gw, GHSA-gh4c-6fx4-qh6g
    "certifi>=2026.10.18",  # GHSA-6q48-6c7w-9gw2
]

[project.optional-dependencies]
# Full server installation
server = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "anyio>=4.14.2",  # security floor (GHSA-82r6-8w77-94w6); pulled in by starlette
]
# All dependencies
all = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "anyio>=4.14.2",  # security floor (GHSA-82r6-8w77-94w6); pulled in by starlette
]
# Development dependencies
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout>=2.1.0",
    "httpx>=0.24.0",
    "ruff==0.16.1",  # pinned: keep in sync with lint.yml + .pre-commit-config.yaml
]
# Documentation
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material[imaging]>=9.7.7",  # [imaging] pulls cairosvg+pillow for social cards
    "mkdocs-git-revision-date-localized-plugin>=1.2.0",
    "GitPython>=3.2.1",  # security floor; pulled in by the git-revision-date plugin
]

[project.urls]
Homepage = "https://tako-research.github.io/TakoVM/"
Documentation = "https://tako-research.github.io/TakoVM/"
Repository = "https://github.com/Tako-Research/TakoVM"
Issues = "https://github.com/Tako-Research/TakoVM/issues"
Changelog = "https://github.com/Tako-Research/TakoVM/blob/main/CHANGELOG.md"

[project.scripts]
tako-vm = "tako_vm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["tako_vm"]

[tool.hatch.build.targets.sdist]
include = [
    "/tako_vm",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/NOTICE",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
filterwarnings = [
    "ignore:urllib3 v2 only supports OpenSSL",
]
markers = [
    "requires_host_mounts: tests that require mounting host paths (skip in VM environments)",
    "requires_gvisor: tests that require gVisor runtime",
    "slow: marks tests as slow",
]

[dependency-groups]
tools = [
    "pre-commit>=4.3.0",
    "pyright>=1.1.408",
]

[tool.uv]
# uv.lock is the development lockfile (CI, the server image and `pip install`
# resolve from the ranges above instead). Python 3.10 reached end of life in
# October 2026 and several dev and docs dependencies (Pillow, filelock) have
# no patched release that still supports it, so the lock is resolved for
# Python 3.11 and later only. The package itself still installs on 3.10.
environments = ["python_version >= '3.11'"]
